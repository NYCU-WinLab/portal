name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run tokens:check
      - run: bun run actions:check
      - run: bun run build

  # Our own PAdES signer, judged by pyHanko: two signatures with
  # timestamps and the B-LT validation data must pass ETSI validation.
  pades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: pip install pyhanko-cli==0.5.0 pyhanko==0.37.0 pyhanko-certvalidator
      - run: bun run pades:check base
      - run: cd .pades && python ../scripts/pades-vendor.py
      - run: bun run pades:check
      - name: Validate with pyHanko
        run: |
          set -o pipefail
          for f in out-vendor-xrefstream out-vendor-classic out-vendor-certified; do
            pyhanko sign adesverify --pretty-print --trust .pades/vendor.pem --trust .pades/root.pem --no-revocation-check .pades/$f.pdf | tee .pades/$f.txt
            test "$(grep -c 'The signature is judged VALID' .pades/$f.txt)" = 2
          done
          cmp .pades/vendor-locked.pdf .pades/out-vendor-locked.pdf
          pyhanko sign adesverify --pretty-print --trust .pades/root.pem .pades/signed.pdf | tee .pades/report.txt
          test "$(grep -c 'The signature is judged VALID' .pades/report.txt)" = 2
          grep -q 'Field 1: Uploader' .pades/report.txt
          grep -q 'Field 2: Reviewer' .pades/report.txt
          ! grep -qi 'INVALID' .pades/report.txt

  # The image as deployed: compose up with Postgres, migrations, then probe
  # sign-in, OAuth discovery and the MCP challenge.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image under the tag compose uses
        run: docker build -t ghcr.io/nycu-winlab/portal:ci .
      - name: Start the stack
        run: |
          cat > .env <<ENV
          PORTAL_VERSION=ci
          PORTAL_PORT=3000
          POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)
          BETTER_AUTH_URL=http://localhost:3000
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          KEYCLOAK_ISSUER=https://auth.winlab.tw/realms/winlab
          KEYCLOAK_CLIENT_ID=ci
          KEYCLOAK_CLIENT_SECRET=ci
          ENV
          docker compose up -d --wait
      - name: Probe
        run: |
          docker compose logs migrate | grep -q "migrations applied"
          test "$(curl -s -o /dev/null -w "%{http_code}" localhost:3000/sign-in)" = 303
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = 307
          curl -sf localhost:3000/.well-known/oauth-protected-resource/mcp | grep -q '"resource":"http://localhost:3000/mcp"'
          curl -sf localhost:3000/.well-known/oauth-authorization-server/api/auth | grep -q '"client_id_metadata_document_supported":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/mcp -H 'content-type: application/json' -d '{}')" = 401
          curl -s -D - -o /dev/null -X POST localhost:3000/mcp -H 'content-type: application/json' -d '{}' | grep -qi 'www-authenticate: Bearer resource_metadata='
      - if: always()
        run: docker compose logs
