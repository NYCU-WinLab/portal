name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # api:check compares the contract with main's.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run tokens:check
      - run: bun run actions:check
      - run: bun run api:check
      - run: bun run build

  # Builds the image once, runs deploy/smoke.sh against it and pushes it
  # as candidate-<tree>. promote makes it tree-<tree> once every job passed,
  # and release ships only a tree- image.
  image:
    uses: zyx1121/.github/.github/workflows/image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '[{"name": "ghcr.io/nycu-winlab/portal"}]'
      smoke: bash deploy/smoke.sh

  promote:
    needs: [check, image]
    uses: zyx1121/.github/.github/workflows/promote.yml@main
    permissions:
      contents: read
      packages: write
    with:
      images: '["ghcr.io/nycu-winlab/portal"]'
