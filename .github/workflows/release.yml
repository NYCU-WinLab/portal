name: release

# Ships only an image ci passed. A merged pull request's image is already
# tree-<tree> (ci's publish job), so the push to main retags and deploys it
# at once. Otherwise (main moved meanwhile, or a direct push) the push finds
# no tree- image and waits: ci on main publishes it, and its completion runs
# this again.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nycu-winlab/portal
    outputs:
      sha: ${{ steps.ship.outputs.sha }}
      deploy: ${{ steps.ship.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ship
        name: Retag the image ci passed
        run: |
          commit=$(git rev-parse HEAD)
          sha="sha-${commit::7}"
          tree="tree-$(git rev-parse 'HEAD^{tree}')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          has() { docker buildx imagetools inspect "$IMAGE:$1" >/dev/null 2>&1; }
          # A newer commit on main ships instead: never roll main back.
          if [ "$commit" != "$(git ls-remote origin refs/heads/main | cut -f1)" ]; then
            echo "main has moved past $commit; skipping"; exit 0
          fi
          if has "$sha"; then
            echo "$sha is already released"; exit 0
          fi
          if ! has "$tree"; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "No image passed ci for these files yet; ci on main will ship it."
              exit 0
            fi
            echo "::error::ci passed but $IMAGE:$tree is missing"; exit 1
          fi
          docker buildx imagetools create -t "$IMAGE:$sha" -t "$IMAGE:main" "$IMAGE:$tree"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  # Ships the new tag to portal.winlab.tw: carrel-deployd on the Carrel
  # machine runs deploy/carrel-start.sh and rolls back if web is unhealthy.
  deploy:
    needs: image
    if: needs.image.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: |
          mkdir release
          cp deploy/carrel-start.sh compose.yaml release/
          echo "${{ needs.image.outputs.sha }}" > release/VERSION
          tar czf "$RUNNER_TEMP/portal.tar.gz" -C release .
      - uses: NYCU-WinLab/carrel-deploy@v1
        with:
          tenant: winfra
          app: portal
          artifact: ${{ runner.temp }}/portal.tar.gz
