name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  # ci's smoke job builds every pull request's image and tags it by tree.
  # A merge with the same files only gets that image retagged, in seconds;
  # otherwise (main moved meanwhile, or a direct push) it is built here.
  image:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nycu-winlab/portal
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
      - id: reuse
        name: Retag the pull request's image
        run: |
          tree="$IMAGE:tree-${{ steps.build.outputs.tree }}"
          if docker buildx imagetools inspect "$tree" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:sha-${{ steps.build.outputs.sha }}" -t "$IMAGE:main" "$tree"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.reuse.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.build.outputs.sha }}
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:tree-${{ steps.build.outputs.tree }}
          build-args: |
            BUILD_TIME=${{ steps.build.outputs.time }}
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # Ships the new tag to portal.winlab.tw: carrel-deployd on the Carrel
  # machine runs deploy/carrel-start.sh and rolls back if web is unhealthy.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir release
          cp deploy/carrel-start.sh release/
          echo "sha-${GITHUB_SHA::7}" > release/VERSION
          tar czf "$RUNNER_TEMP/portal.tar.gz" -C release .
      - uses: NYCU-WinLab/carrel-deploy@v1
        with:
          tenant: winfra
          app: portal
          artifact: ${{ runner.temp }}/portal.tar.gz
