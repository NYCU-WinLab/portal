name: release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nycu-winlab/portal
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BUILD_SHA=${{ steps.build.outputs.sha }}
            BUILD_TIME=${{ steps.build.outputs.time }}
            BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Ships the new tag to portal.winlab.tw: carrel-deployd on the Carrel
  # machine runs deploy/carrel-start.sh and rolls back if web is unhealthy.
  deploy:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir release
          cp deploy/carrel-start.sh release/
          echo "sha-${GITHUB_SHA::7}" > release/VERSION
          tar czf "$RUNNER_TEMP/portal.tar.gz" -C release .
      - uses: NYCU-WinLab/carrel-deploy@v1
        with:
          tenant: winfra
          app: portal
          artifact: ${{ runner.temp }}/portal.tar.gz
